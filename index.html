<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="google-site-verification" content="I045WdaTfVLIELko6_Ez9VWO1BDVfrWKLnGs2w5MHvQ">
  <meta name="description" content="Send and receive a text message with a one-time code. QuietSend keeps sharing simple.">
  <meta property="og:title" content="QuietSend — One-time text sharing">
  <meta property="og:description" content="A simple, private-minded way to share a text with a one-time code.">
  <meta property="og:type" content="website">
  <title>QuietSend — One-time text sharing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script defer src="./assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to message sharing</a>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="QuietSend home"><span class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span></span><span class="brand-name">QuietSend <span>/ text</span></span></a>
    <div class="topbar-right"><span class="connection-status" id="connection-status" data-state="info"><i></i><span>Connecting</span></span></div>
  </header>
  <main>
    <section class="intro shell">
      <p class="eyebrow"><span class="eyebrow-dot"></span> TEXT SHARING</p>
      <h1>Send a thought.<br><span>Keep it simple.</span></h1>
    </section>
    <section class="workspace shell" id="workspace" aria-label="Text sharing app">
      <div class="workspace-top"><div><p class="section-overline">QUIETSEND</p><h2>Text message</h2></div><span class="workspace-mark">TEXT ONLY</span></div>
      <div class="main-tabs" role="tablist" aria-label="Choose an action">
        <button class="main-tab is-active" id="tab-send" type="button" role="tab" aria-selected="true" data-tab="send"><span class="tab-icon" aria-hidden="true">↗</span> Send text</button>
        <button class="main-tab" id="tab-receive" type="button" role="tab" aria-selected="false" data-tab="receive"><span class="tab-icon" aria-hidden="true">↙</span> Receive text</button>
      </div>
      <section class="panel" id="panel-send" aria-labelledby="tab-send">
        <div class="panel-heading"><div><h3>Send text</h3></div></div>
        <div class="composer-area text-composer">
          <label class="field-label" for="message-text">MESSAGE</label>
          <textarea id="message-text" maxlength="8000" placeholder="Write your message here…" spellcheck="true"></textarea>
          <div class="field-meta"><span></span><span id="character-count">0 / 8,000</span></div>
        </div>
        <div class="action-row"><button class="primary-button" id="send-button" type="button"><span id="send-button-label">Create code</span><span aria-hidden="true">↗</span></button></div>
        <div class="feedback" id="send-feedback" role="status" aria-live="polite" hidden></div>
        <div class="code-result" id="code-result" hidden><div><span class="result-overline">SHARE THIS CODE</span><p class="result-code" id="created-code">0000</p></div><button class="secondary-button" id="copy-code" type="button">Copy code</button></div>
      </section>
      <section class="panel" id="panel-receive" aria-labelledby="tab-receive" hidden>
        <div class="panel-heading"><div><h3>Receive text</h3></div></div>
        <label class="field-label" for="receive-code">CODE</label>
        <input id="receive-code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" placeholder="••••">
        
        <div class="action-row"><button class="primary-button" id="receive-button" type="button"><span id="receive-button-label">Receive text</span><span aria-hidden="true">↙</span></button></div>
        <div class="feedback" id="receive-feedback" role="status" aria-live="polite" hidden></div>
        <article class="received-card" id="received-card" hidden><div class="received-card-header"><div><span class="result-overline" id="received-type">RECEIVED TEXT</span></div><button class="secondary-button" id="copy-message" type="button">Copy text</button></div><div class="received-content" id="received-content"></div></article>
      </section>
    </section>
  </main>
</body>
</html>
